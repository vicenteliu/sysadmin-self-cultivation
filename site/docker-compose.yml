# The repo is mounted read-only, so editing a document and reloading the browser
# behaves exactly as it does under `python3 site/serve.py`. Nothing is baked in.
#
#   docker compose -f site/docker-compose.yml up      →  http://127.0.0.1:8099
#
# To hand the whole thing to someone who has no clone, build the self-contained
# image instead — see site/Dockerfile.

services:
  docs:
    image: nginx:1.27-alpine
    container_name: sysadmin-self-cultivation-docs
    ports:
      # Host 8099, container 8080: 8080 is the port most likely to be already taken
      # on a developer machine, and a default that collides is not a default.
      - "127.0.0.1:8099:8080"
    volumes:
      - ../:/repo:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
