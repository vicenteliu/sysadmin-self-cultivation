<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 456" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="repo-map-dark-title repo-map-dark-desc">
      <title id="repo-map-dark-title">Six axes over one body of material</title>
      <desc id="repo-map-dark-desc">Six entry points — start here, foundations, the stack, platforms, cross-cutting and toolbox — are shown as six views onto a single shared body of material, with the build-out chapter set apart beneath them as one route across all six rather than a seventh axis.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b8b2a6"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c99a5b"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7fa3c4"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#1a1a17"/>

      <!-- zone: the shared material every axis is a view of -->
      <rect x="40" y="40" width="1120" height="192" rx="8" fill="rgba(250,248,244,0.02)" stroke="rgba(250,248,244,0.10)" stroke-width="0.8"/>
      <rect x="52" y="44" width="180" height="12" rx="2" fill="#1a1a17"/>
      <text x="60" y="53" fill="rgba(250,248,244,0.40)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">ONE BODY OF MATERIAL · SIX VIEWS</text>

      <!-- axis 1 -->
      <rect x="60" y="72" width="160" height="128" rx="6" fill="#1a1a17"/>
      <rect x="60" y="72" width="160" height="128" rx="6" fill="rgba(250,248,244,0.05)" stroke="#b8b2a6" stroke-width="1"/>
      <text x="140" y="98" fill="#8f887c" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em" data-axis="start-here">20 DOCS</text>
      <text x="140" y="132" fill="#faf8f4" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Start here</text>
      <text x="140" y="156" fill="#b8b2a6" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">WHY · the model</text>
      <text x="140" y="172" fill="#b8b2a6" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ai-workflow · skills</text>

      <!-- axis 2 -->
      <rect x="244" y="72" width="160" height="128" rx="6" fill="#1a1a17"/>
      <rect x="244" y="72" width="160" height="128" rx="6" fill="rgba(250,248,244,0.05)" stroke="#b8b2a6" stroke-width="1"/>
      <text x="324" y="98" fill="#8f887c" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em" data-axis="foundations">3 DOCS</text>
      <text x="324" y="132" fill="#faf8f4" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Foundations</text>
      <text x="324" y="156" fill="#b8b2a6" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Linux · scripting</text>
      <text x="324" y="172" fill="#b8b2a6" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the floor</text>

      <!-- axis 3 -->
      <rect x="428" y="72" width="160" height="128" rx="6" fill="#1a1a17"/>
      <rect x="428" y="72" width="160" height="128" rx="6" fill="rgba(250,248,244,0.05)" stroke="#b8b2a6" stroke-width="1"/>
      <text x="508" y="98" fill="#8f887c" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em" data-axis="the-stack">11 DOCS</text>
      <text x="508" y="132" fill="#faf8f4" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">The Stack</text>
      <text x="508" y="156" fill="#b8b2a6" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">01 physical up to</text>
      <text x="508" y="172" fill="#b8b2a6" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">07 security</text>

      <!-- axis 4 -->
      <rect x="612" y="72" width="160" height="128" rx="6" fill="#1a1a17"/>
      <rect x="612" y="72" width="160" height="128" rx="6" fill="rgba(250,248,244,0.05)" stroke="#b8b2a6" stroke-width="1"/>
      <text x="692" y="98" fill="#8f887c" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em" data-axis="platforms">60 DOCS</text>
      <text x="692" y="132" fill="#faf8f4" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Platforms</text>
      <text x="692" y="156" fill="#b8b2a6" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">seven of them</text>
      <text x="692" y="172" fill="#b8b2a6" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">AWS worked through</text>

      <!-- axis 5 -->
      <rect x="796" y="72" width="160" height="128" rx="6" fill="#1a1a17"/>
      <rect x="796" y="72" width="160" height="128" rx="6" fill="rgba(250,248,244,0.05)" stroke="#b8b2a6" stroke-width="1"/>
      <text x="876" y="98" fill="#8f887c" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em" data-axis="cross-cutting">35 DOCS</text>
      <text x="876" y="132" fill="#faf8f4" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Cross-cutting</text>
      <text x="876" y="156" fill="#b8b2a6" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">identity · IaC · CI/CD</text>
      <text x="876" y="172" fill="#b8b2a6" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">K8s · TLS · cost</text>

      <!-- axis 6 -->
      <rect x="980" y="72" width="160" height="128" rx="6" fill="#1a1a17"/>
      <rect x="980" y="72" width="160" height="128" rx="6" fill="rgba(250,248,244,0.05)" stroke="#b8b2a6" stroke-width="1"/>
      <text x="1060" y="98" fill="#8f887c" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em" data-axis="toolbox">16 DOCS</text>
      <text x="1060" y="132" fill="#faf8f4" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Toolbox</text>
      <text x="1060" y="156" fill="#b8b2a6" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">scripts · roles</text>
      <text x="1060" y="172" fill="#b8b2a6" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">a pack you generate</text>

      <!-- the route: spans exactly the six, and is set apart from them -->
      <rect x="40" y="296" width="1120" height="72" rx="8" fill="#1a1a17"/>
      <rect x="40" y="296" width="1120" height="72" rx="8" fill="rgba(201,154,91,0.10)" stroke="#c99a5b" stroke-width="1"/>
      <text x="64" y="322" fill="#c99a5b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">A ROUTE ACROSS THE SIX — NOT A SEVENTH AXIS</text>
      <text x="64" y="348" fill="#faf8f4" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif">build-out/ — one 100-person office</text>
      <text x="1136" y="348" fill="#b8b2a6" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">16 steps · empty lease to running estate</text>

      <!-- editorial callout -->
      <line x1="40" y1="404" x2="40" y2="432" stroke="#c99a5b" stroke-width="2"/>
      <text x="56" y="418" fill="#b8b2a6" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, serif">It teaches no new page. It decides the order.</text>
      <text x="1160" y="418" fill="#8f887c" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.12em">ADR-0001</text>
    </svg>
