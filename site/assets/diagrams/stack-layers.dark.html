<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The stack, read bottom-up</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #1a1a17;
      --color-ink:     #faf8f4;
      --color-muted:   #b8b2a6;
      --color-accent:  #c99a5b;
      --font-sans:     'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
      --font-serif:    'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono:     'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer stack · The Sysadmin's Self-Cultivation</p>
    <h1>The stack, read bottom-up</h1>

    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="stack-layers-dark-title stack-layers-dark-desc">
      <title id="stack-layers-dark-title">The stack, read bottom-up</title>
      <desc id="stack-layers-dark-desc">Seven layers of an estate stacked from the physical layer at the bottom to security at the top, each with the job it does, with the network layer marked as the one where the seven platforms differ most.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b8b2a6"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c99a5b"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7fa3c4"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#1a1a17"/>

      <text x="76" y="56" fill="#8f887c" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">READ BOTTOM-UP — 01 IS THE FLOOR, AND EVERY LAYER IS COMPARED ACROSS ALL SEVEN PLATFORMS</text>

      <rect x="76" y="72" width="848" height="448" rx="8" fill="#1a1a17" stroke="#b8b2a6" stroke-width="1"/>

      <text x="96" y="110" fill="#8f887c" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">07</text>
      <text x="148" y="110" fill="#faf8f4" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">Security</text>
      <text x="904" y="110" fill="#b8b2a6" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">identity · secrets · boundaries</text>
      <line x1="76" y1="136" x2="924" y2="136" stroke="rgba(250,248,244,0.12)" stroke-width="1"/>

      <text x="96" y="174" fill="#8f887c" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">06</text>
      <text x="148" y="174" fill="#faf8f4" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">Observability</text>
      <text x="904" y="174" fill="#b8b2a6" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">logs · metrics · traces</text>
      <line x1="76" y1="200" x2="924" y2="200" stroke="rgba(250,248,244,0.12)" stroke-width="1"/>

      <text x="96" y="238" fill="#8f887c" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">05</text>
      <text x="148" y="238" fill="#faf8f4" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">Platform services</text>
      <text x="904" y="238" fill="#b8b2a6" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">managed DB · queues · DNS</text>
      <line x1="76" y1="264" x2="924" y2="264" stroke="rgba(250,248,244,0.12)" stroke-width="1"/>

      <text x="96" y="302" fill="#8f887c" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">04</text>
      <text x="148" y="302" fill="#faf8f4" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">Storage</text>
      <text x="904" y="302" fill="#b8b2a6" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">block · object · file</text>
      <line x1="76" y1="328" x2="924" y2="328" stroke="rgba(250,248,244,0.12)" stroke-width="1"/>

      <text x="96" y="366" fill="#8f887c" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">03</text>
      <text x="148" y="366" fill="#faf8f4" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">Compute &amp; images</text>
      <text x="904" y="366" fill="#b8b2a6" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">VM · container · image pipeline</text>
      <line x1="76" y1="392" x2="924" y2="392" stroke="rgba(250,248,244,0.12)" stroke-width="1"/>

      <rect x="76" y="392" width="848" height="64" fill="rgba(201,154,91,0.10)"/>
      <line x1="76" y1="392" x2="924" y2="392" stroke="#c99a5b" stroke-width="1"/>
      <line x1="76" y1="456" x2="924" y2="456" stroke="#c99a5b" stroke-width="1"/>
      <text x="96" y="430" fill="#c99a5b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">02</text>
      <text x="148" y="430" fill="#faf8f4" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">Network</text>
      <text x="904" y="430" fill="#c99a5b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">address · connect · isolate · filter</text>

      <text x="96" y="494" fill="#8f887c" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">01</text>
      <text x="148" y="494" fill="#faf8f4" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">Physical</text>
      <text x="904" y="494" fill="#b8b2a6" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">failure domains · power · racks</text>

      <line x1="76" y1="548" x2="924" y2="548" stroke="rgba(250,248,244,0.12)" stroke-width="0.8"/>
      <text x="76" y="576" fill="#b8b2a6" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, serif">02 is where the seven platforms differ most — and where the money quietly leaks.</text>
      <text x="924" y="576" fill="#8f887c" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.12em">THE-STACK/02</text>
    </svg>
  </div>
</body>
</html>
