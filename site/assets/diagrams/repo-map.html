<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Six axes over one body of material</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #faf8f4;
      --color-ink:     #26262b;
      --color-muted:   #5d5a52;
      --color-accent:  #a8763e;
      --font-sans:     'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
      --font-serif:    'Instrument Serif', Georgia, 'Times New Roman', serif;
      --font-mono:     'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · The Sysadmin's Self-Cultivation</p>
    <h1>Six axes over one body of material</h1>

    <svg viewBox="0 0 1200 456" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="repo-map-title repo-map-desc">
      <title id="repo-map-title">Six axes over one body of material</title>
      <desc id="repo-map-desc">Six entry points — start here, foundations, the stack, platforms, cross-cutting and toolbox — are shown as six views onto a single shared body of material, with the build-out chapter set apart beneath them as one route across all six rather than a seventh axis.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5d5a52"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a8763e"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a6b8a"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#faf8f4"/>

      <!-- zone: the shared material every axis is a view of -->
      <rect x="40" y="40" width="1120" height="192" rx="8" fill="rgba(38,38,43,0.02)" stroke="rgba(38,38,43,0.10)" stroke-width="0.8"/>
      <rect x="52" y="44" width="180" height="12" rx="2" fill="#faf8f4"/>
      <text x="60" y="53" fill="rgba(38,38,43,0.40)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">ONE BODY OF MATERIAL · SIX VIEWS</text>

      <!-- axis 1 -->
      <rect x="60" y="72" width="160" height="128" rx="6" fill="#faf8f4"/>
      <rect x="60" y="72" width="160" height="128" rx="6" fill="rgba(38,38,43,0.05)" stroke="#5d5a52" stroke-width="1"/>
      <text x="140" y="98" fill="#8a8479" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em" data-axis="start-here">20 DOCS</text>
      <text x="140" y="132" fill="#26262b" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Start here</text>
      <text x="140" y="156" fill="#5d5a52" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">WHY · the model</text>
      <text x="140" y="172" fill="#5d5a52" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ai-workflow · skills</text>

      <!-- axis 2 -->
      <rect x="244" y="72" width="160" height="128" rx="6" fill="#faf8f4"/>
      <rect x="244" y="72" width="160" height="128" rx="6" fill="rgba(38,38,43,0.05)" stroke="#5d5a52" stroke-width="1"/>
      <text x="324" y="98" fill="#8a8479" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em" data-axis="foundations">3 DOCS</text>
      <text x="324" y="132" fill="#26262b" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Foundations</text>
      <text x="324" y="156" fill="#5d5a52" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Linux · scripting</text>
      <text x="324" y="172" fill="#5d5a52" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the floor</text>

      <!-- axis 3 -->
      <rect x="428" y="72" width="160" height="128" rx="6" fill="#faf8f4"/>
      <rect x="428" y="72" width="160" height="128" rx="6" fill="rgba(38,38,43,0.05)" stroke="#5d5a52" stroke-width="1"/>
      <text x="508" y="98" fill="#8a8479" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em" data-axis="the-stack">15 DOCS</text>
      <text x="508" y="132" fill="#26262b" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">The Stack</text>
      <text x="508" y="156" fill="#5d5a52" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">01 physical up to</text>
      <text x="508" y="172" fill="#5d5a52" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">07 security</text>

      <!-- axis 4 -->
      <rect x="612" y="72" width="160" height="128" rx="6" fill="#faf8f4"/>
      <rect x="612" y="72" width="160" height="128" rx="6" fill="rgba(38,38,43,0.05)" stroke="#5d5a52" stroke-width="1"/>
      <text x="692" y="98" fill="#8a8479" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em" data-axis="platforms">63 DOCS</text>
      <text x="692" y="132" fill="#26262b" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Platforms</text>
      <text x="692" y="156" fill="#5d5a52" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">seven of them</text>
      <text x="692" y="172" fill="#5d5a52" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">AWS worked through</text>

      <!-- axis 5 -->
      <rect x="796" y="72" width="160" height="128" rx="6" fill="#faf8f4"/>
      <rect x="796" y="72" width="160" height="128" rx="6" fill="rgba(38,38,43,0.05)" stroke="#5d5a52" stroke-width="1"/>
      <text x="876" y="98" fill="#8a8479" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em" data-axis="cross-cutting">40 DOCS</text>
      <text x="876" y="132" fill="#26262b" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Cross-cutting</text>
      <text x="876" y="156" fill="#5d5a52" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">identity · IaC · CI/CD</text>
      <text x="876" y="172" fill="#5d5a52" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">K8s · TLS · cost</text>

      <!-- axis 6 -->
      <rect x="980" y="72" width="160" height="128" rx="6" fill="#faf8f4"/>
      <rect x="980" y="72" width="160" height="128" rx="6" fill="rgba(38,38,43,0.05)" stroke="#5d5a52" stroke-width="1"/>
      <text x="1060" y="98" fill="#8a8479" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em" data-axis="toolbox">16 DOCS</text>
      <text x="1060" y="132" fill="#26262b" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Toolbox</text>
      <text x="1060" y="156" fill="#5d5a52" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">scripts · roles</text>
      <text x="1060" y="172" fill="#5d5a52" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">a pack you generate</text>

      <!-- the route: spans exactly the six, and is set apart from them -->
      <rect x="40" y="296" width="1120" height="72" rx="8" fill="#faf8f4"/>
      <rect x="40" y="296" width="1120" height="72" rx="8" fill="rgba(168,118,62,0.08)" stroke="#a8763e" stroke-width="1"/>
      <text x="64" y="322" fill="#a8763e" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">A ROUTE ACROSS THE SIX — NOT A SEVENTH AXIS</text>
      <text x="64" y="348" fill="#26262b" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif">build-out/ — one 100-person office</text>
      <text x="1136" y="348" fill="#5d5a52" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">16 steps · empty lease to running estate</text>

      <!-- editorial callout -->
      <line x1="40" y1="404" x2="40" y2="432" stroke="#a8763e" stroke-width="2"/>
      <text x="56" y="418" fill="#5d5a52" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, serif">It teaches no new page. It decides the order.</text>
      <text x="1160" y="418" fill="#8a8479" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.12em">ADR-0001</text>
    </svg>
  </div>
</body>
</html>
