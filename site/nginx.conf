# The container half of the same URL contract `site/serve.py` implements:
#
#   /                             the viewer, from /repo/site
#   /doc/<repo-relative>.md       Markdown, from /repo
#   /doc/docs/index.json          the retrieval index
#
# serve.py enforces the contract with an allowlist read from the retrieval index.
# nginx enforces it by extension and by refusing every dotted path segment — the
# slightly looser of the two, and deliberately so: nginx has no index to read at
# request time. Both refuse .git, .serena, and every non-Markdown file in the tree.

server {
    listen 8080;
    server_name _;
    root /repo/site;

    charset utf-8;
    charset_types text/markdown application/json application/javascript text/css image/svg+xml;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/markdown application/json
               application/javascript image/svg+xml;

    # No dotfile is ever reachable, under any prefix.
    location ~ /\. { access_log off; return 404; }

    location = /doc/docs/index.json {
        alias /repo/docs/index.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    location ~ "^/doc/(?<docpath>[A-Za-z0-9][A-Za-z0-9._/-]*\.md)$" {
        if ($docpath ~ "(^|/)\.") { return 404; }   # belt and braces against ../ tricks
        alias /repo/$docpath;
        default_type text/markdown;
        add_header Cache-Control "no-cache";
    }

    location /doc/ { return 404; }

    # The 2.5 MB mermaid bundle and the 1.2 MB corpus are content-addressed by hand:
    # they change only when someone regenerates them, so let the browser keep them.
    location ~* ^/(vendor|assets)/ { expires 7d; add_header Cache-Control "public"; }
    location = /corpus.json { expires 1h; add_header Cache-Control "public"; }

    location / { try_files $uri $uri/ /index.html; }
}
